schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  The big picture is in openspec/docs/roadmap.md: slices, changes, order, dependencies, capabilities and status.
  Before you propose a change, read its entry in roadmap.md and use its name, scope and capabilities.
  If a change differs from the roadmap (scope, dependencies, capabilities), update roadmap.md in the same change.
  Project-wide guardrails are in openspec/docs/architecture.md and openspec/docs/tech-stack.md.
  The purpose and value of the product are in openspec/docs/vision.md. A proposal must serve it; its Why section refers to it where it fits.
  openspec/docs/initial-plan.md is frozen and partly old. Use it only for the detail of planned changes. When it disagrees with the other docs, the other docs win.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Every requirement has at least one scenario with concrete input and expected output (for example the exact text before and after), not a general statement.
    - Scenarios do not have to be Gherkin. WHEN/THEN bullets, tables of examples and measurable non-functional checks are all valid.
    - Each requirement covers one rule, so that two changes rarely modify the same requirement.
  design:
    - Include a Tests section with the test strategy (test levels, tools, property tests, manual checks).
    - If the change touches packages/obsidian or what the user sees or does in Obsidian, the Tests section lists the scenarios that need the real app (layout, cursor and keys, menus, command palette, notices, Reading view, Source mode, files on disk, hover) and gives each one an e2e test in packages/e2e. End-to-end tests are the strong default for this behaviour; a scenario that stays manual (for example colours) needs a reason. See openspec/docs/testing.md.
  tasks:
    - For each spec file, add a task for a spec test file with one test per scenario. Use the scenario names as the test names.
    - Each task ends with a verification step ("Verify that ...").
    - Manual or end-to-end checks for this change are separate tasks at the end.
    - 'For each scenario that needs the real Obsidian app, add a task for an e2e test in packages/e2e/tests (it name = scenario name) and change the matching vitest test.todo to a pointer ("<scenario>: e2e in packages/e2e/tests/<file>.e2e.ts").'
    - If the change touches packages/obsidian, add a task that runs pnpm test:e2e:docker (all e2e tests pass), and before archive a task that runs pnpm test:e2e on macOS.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - When apply starts, set the change status in openspec/docs/roadmap.md to "applying".
  archive:
    guidance:
      - Before archive, copy important lasting design decisions from design.md into openspec/docs/. E.g into architecture.md or tech-stack.md to act as non-funcitonal guardrails.
      - After archive, set the change status in openspec/docs/roadmap.md to "archived" and update the "Main spec exists" column.
